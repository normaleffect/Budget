<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0B0E13" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#F6F7FA" media="(prefers-color-scheme: light)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Ledger" />
<meta name="description" content="Family budget, forecasting and goal planning." />
<title>Ledger</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./assets/icon-180.png" />
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="topbar-inner">
        <div class="topbar-title">
          <h1 id="view-title">Home</h1>
          <p id="view-sub"></p>
        </div>
        <button id="btn-menu" class="icon-btn" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.64 8.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34H9a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
      <nav id="subnav" class="subnav" hidden></nav>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav id="tabbar" aria-label="Main">
      <button data-tab="home"     class="tab"><span class="tab-ico" data-ico="home"></span><span>Home</span></button>
      <button data-tab="budget"   class="tab"><span class="tab-ico" data-ico="budget"></span><span>Budget</span></button>
      <button data-tab="flow"     class="tab"><span class="tab-ico" data-ico="flow"></span><span>Flow</span></button>
      <button data-tab="goals"    class="tab"><span class="tab-ico" data-ico="goals"></span><span>Goals</span></button>
      <button data-tab="plan"     class="tab"><span class="tab-ico" data-ico="plan"></span><span>Plan</span></button>
    </nav>
  </div>

  <div id="sheet-scrim" class="scrim" hidden></div>
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <div class="sheet-head"><h2 id="sheet-title"></h2><button id="sheet-close" class="icon-btn" aria-label="Close">&times;</button></div>
    <div id="sheet-body" class="sheet-body"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
